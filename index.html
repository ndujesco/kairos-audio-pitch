<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="A simple audio pitch player with automatic repeat.">
  <title>Kairos audio pitch</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #162d25; background: #f3f7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 1.25rem; }
    main { width: 100%; max-width: 29rem; padding: clamp(1.25rem, 5vw, 2.25rem); background: #fff; border: 1px solid #dce7e1; border-radius: 1.25rem; box-shadow: 0 12px 40px #183c2910; }
    .mark { display: grid; place-items: center; width: 3rem; height: 3rem; margin-bottom: 1.5rem; border-radius: .875rem; color: #1d694b; background: #e8f3ed; }
    h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; letter-spacing: -.04em; font-weight: 650; }
    p { margin: .75rem 0 1.75rem; color: #52685e; font-size: 1rem; line-height: 1.6; }
    audio { display: block; width: 100%; }
    .settings { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; font-size: 1rem; }
    label { display: inline-flex; align-items: center; gap: .5rem; min-height: 2.75rem; }
    input { width: 1.125rem; height: 1.125rem; margin: 0; accent-color: #216b4e; }
    .select { display: inline-flex; align-items: center; position: relative; }
    .select svg { position: absolute; right: .625rem; pointer-events: none; }
    select { font: inherit; color: inherit; background: #fff; border: 1px solid #cad9d0; border-radius: .5rem; padding: .5rem 1.875rem .5rem .625rem; min-height: 2.75rem; appearance: none; cursor: pointer; }
    button { display: block; width: 100%; margin-top: 1.5rem; min-height: 2.75rem; border: 1px solid #cad9d0; border-radius: .625rem; background: #fff; color: #1e5840; font: inherit; cursor: pointer; }
    button:hover { background: #f0f7f3; border-color: #6d9b81; }
    :focus-visible { outline: 3px solid #398668; outline-offset: 4px; }
    .privacy { margin: 1.5rem 0 0; text-align: center; font-size: .875rem; color: #667a6f; }
    #error { color: #a02727; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/>
      </svg>
    </div>
    <h1>Kairos audio pitch</h1>
    <p>Press play. It repeats automatically.</p>
    <audio id="audio" controls loop preload="metadata" aria-label="Kairos audio pitch">
      <source src="./pitch.mp3" type="audio/mpeg">
      Your browser does not support audio playback.
    </audio>
    <div class="settings">
      <label><input id="repeat" type="checkbox" checked> Repeat</label>
      <label for="speed">Speed
        <span class="select">
          <select id="speed">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.1">1.1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 4.5 3 3 3-3"/></svg>
        </span>
      </label>
    </div>
    <button id="restart" type="button">Play from the start</button>
    <p id="error" role="alert" hidden></p>
    <p class="privacy">Works offline. No uploads.</p>
  </main>
  <script>
    const audio = document.getElementById('audio');
    const error = document.getElementById('error');
    function showError(message) {
      error.textContent = message;
      error.hidden = false;
    }
    document.getElementById('repeat').addEventListener('change', (event) => {
      audio.loop = event.target.checked;
    });
    document.getElementById('speed').addEventListener('change', (event) => {
      audio.playbackRate = Number(event.target.value);
      audio.defaultPlaybackRate = audio.playbackRate;
    });
    document.getElementById('restart').addEventListener('click', async () => {
      try {
        audio.currentTime = 0;
        await audio.play();
      } catch (playError) {
        if (playError.name !== 'AbortError') {
          showError('Could not start playback. Try the play button above.');
        }
      }
    });
    audio.addEventListener('playing', () => { error.hidden = true; });
    audio.addEventListener('error', () => {
      showError('This browser could not play the audio. Try opening this file in Chrome or Safari.');
    });
  </script>
</body>
</html>
